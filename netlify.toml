[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # PUBLIC_ vars are client-exposed by design (Astro convention), not secrets.
  # Their values legitimately appear in repo docs (.env.example, README) and the
  # built client bundle, so exclude them from Netlify's secrets scanner.
  SECRETS_SCAN_OMIT_KEYS = "PUBLIC_UMAMI_SRC,PUBLIC_UMAMI_ID"

[[redirects]]
  from = "/api/*"
  to = "https://nullbreach-api.wavival.dev/api/:splat"
  status = 200

[[redirects]]
  from = "/nullbreach/*"
  to = "https://null-breach.netlify.app/:splat"
  status = 200
  force = false

# Legacy English-word ES routes renamed to Spanish slugs (content unchanged, still Spanish).
[[redirects]]
  from = "/projects/*"
  to = "/proyectos/:splat"
  status = 301
[[redirects]]
  from = "/projects"
  to = "/proyectos"
  status = 301
[[redirects]]
  from = "/services"
  to = "/servicios"
  status = 301
[[redirects]]
  from = "/about"
  to = "/sobre-mi"
  status = 301
[[redirects]]
  from = "/contact"
  to = "/contacto"
  status = 301
[[redirects]]
  from = "/uses"
  to = "/herramientas"
  status = 301

[[redirects]]
  from = "/en/*"
  to = "/en/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    # Analytics: Umami Cloud (cloud.umami.is + analytics.umami.is) allowed in script-src + connect-src.
    # script-src is hash-based (no 'unsafe-inline'): the sha256-* values are the hashes of every
    # inline <script> Astro emits (theme pre-paint, scroll-reveal, web-vitals, Astro view-transition
    # glue, Calendly define:vars). They are deterministic per build and verified in CI by
    # `npm run csp:check`, which fails if any inline script in dist/ lacks a matching hash here.
    # Regenerate after editing any inline script: run the build, then `npm run csp:check` prints the
    # missing hash to paste in. JSON-LD (type=application/ld+json) is a data block, not gated by CSP.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-DtoVwr4KJZhjAr5tdcFkvqGTgOexBpXPFj9MLnPmn8g=' 'sha256-4hLZ1iA2ZzhmD3DqR1UE/IceK/Z4pmG/KIDBf5O5jN8=' 'sha256-ncntEo4zXOaMzFEe9FdppSrS6EcwwiQk38SYAhfV9i0=' 'sha256-TX1Nn6D7/TaKI6MUR+Om4EVuwl3hx3jsD2qBcPbgAUs=' 'sha256-Kp9oN5afA8SqgM4B4/R3ScV7h2obC8UupQR684axmV4=' 'sha256-6Lj7xAZiLDmjbaWIjpTPyIu6hz2hOFslcgY4LOUxzTY=' 'sha256-tu4dVTa3x3J4waPiQVdEBYpcoQDaa4EDScwiAob+rwk=' 'sha256-6XaXX7LVCC2tByJ14y/3kS2mpf6KZUIMlOYpsqecKSI=' 'sha256-4bbqkKpheor88WsAKTyOp8voTFg1YWG9IR9dGCYU0AQ=' 'sha256-kHuRHNpAm5Q3IQADgfeHeqb5xuUS8RQJFvdxUhwVX1I=' 'sha256-ZtwRmzuRN+YRST6a68pqxWzJMEtm1jNl3Zbfo611sgE=' https://cloud.umami.is https://analytics.umami.is https://assets.calendly.com; style-src 'self' 'unsafe-inline' https://assets.calendly.com; font-src 'self'; img-src 'self' data: https://*.calendly.com https://d3v0px0pttie1i.cloudfront.net; connect-src 'self' https://cloud.umami.is https://analytics.umami.is https://nullbreach-api.wavival.dev https://calendly.com; frame-src https://calendly.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/cv_valentina_ramirez_*.pdf"
  [headers.values]
    Cache-Control = "public, max-age=86400"

