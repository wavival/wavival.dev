name: Validate PR base

# Thin caller. Logic in lumina-w/agents (shared-validate-pr-base.yml).
# lumina-w/agents must stay public: GitHub does not let a repo outside an
# organization call that organization's private repos' reusable workflows.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [dev, stg, main]

permissions: {}

jobs:
  validate-base:
    uses: lumina-w/agents/.github/workflows/shared-validate-pr-base.yml@v4
