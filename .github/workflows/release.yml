name: Release

# Thin caller. The logic lives once in lumina-w/agents (shared-release.yml) and
# implements the release standard of lumina-w/dev-standards. Run it by hand from
# the Actions tab; it always checks out main. See docs/RELEASING.md.
# lumina-w/agents must stay public: GitHub does not let a repo outside an
# organization call that organization's private repos' reusable workflows.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v prefix, e.g. 4.0.0 or 4.1.0-rc.1"
        required: true
        type: string
      prerelease:
        description: "Pre-release (required when the version has a suffix, and only then)"
        type: boolean
        default: false
      dry-run:
        description: "Run every check and create nothing"
        type: boolean
        default: false

permissions: {}

jobs:
  release:
    uses: lumina-w/agents/.github/workflows/shared-release.yml@v4
    permissions:
      contents: write
    with:
      version: ${{ inputs.version }}
      prerelease: ${{ inputs.prerelease }}
      dry-run: ${{ inputs.dry-run }}
