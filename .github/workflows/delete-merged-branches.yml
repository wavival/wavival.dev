name: delete-merged-branches

# Thin caller. Logic in lumina-w/agents (delete-merged-branches.yml): it deletes
# the remote branches of pull requests merged into dev, unless the branch is
# protected, has an open pull request, or its tip moved past the merged head.
# lumina-w/agents must stay public: GitHub does not let a repo outside an
# organization call that organization's private repos' reusable workflows.
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: List the branches that would be deleted without deleting them
        type: boolean
        default: false

concurrency:
  group: delete-merged-branches
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

jobs:
  sweep:
    uses: lumina-w/agents/.github/workflows/delete-merged-branches.yml@v4
    with:
      dry_run: ${{ inputs.dry_run || false }}
